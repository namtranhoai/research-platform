apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-platform
  labels:
    app: research-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-platform
  template:
    metadata:
      labels:
        app: research-platform
    spec:
      containers:
        - name: app
          image: ghcr.io/PLACEHOLDER_ORG/research-platform:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: research-platform
  labels:
    app: research-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: research-platform
